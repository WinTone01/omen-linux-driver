# Read-only EC access, should anything load ec_sys. Nothing in this project
# needs it any more - the GPU temperature comes from omen-kbd-rgb's hwmon -
# but omend falls back to it with an older module, and everything that
# writes goes through hp-wmi's hwmon interface, where the kernel clamps the
# values. Enabling write support here would hand every root process a way to
# poke the EC directly, which is exactly what this project's own
# documentation warns about.
options ec_sys write_support=0
