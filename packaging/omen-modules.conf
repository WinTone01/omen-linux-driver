# The discrete GPU's temperature is only readable through the EC on this
# machine - the NVIDIA driver registers no hwmon for it - so omend needs
# ec_sys to see it. Without this the fan curve follows the CPU alone and
# stays quiet while the GPU heats up.
#
# Read-only: write_support stays off. Installed as
# /usr/lib/modules-load.d/omen.conf, with the option in
# /usr/lib/modprobe.d/omen.conf.
ec_sys
