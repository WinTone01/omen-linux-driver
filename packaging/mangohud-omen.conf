# MangoHud with the OMEN line under the frame rate: profile, both fans, CPU,
# GPU and palm rest temperatures, and PL1. What OMEN Gaming Hub's in-game
# overlay shows, minus what MangoHud already shows better.
#
# Use it for one game:
#   MANGOHUD_CONFIGFILE=/usr/share/omen-control/mangohud-omen.conf mangohud %command%
# or copy the last two lines into ~/.config/MangoHud/MangoHud.conf.
fps
frametime
cpu_temp
gpu_temp
custom_text=OMEN
exec=omenctl overlay
