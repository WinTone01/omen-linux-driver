# What has to hold before anything is merged.
#
# Deliberately modest. The interesting half of this project cannot be tested
# in CI at all - there is no OMEN behind a GitHub runner, so every check that
# matters (does pwm1 appear, does the EC answer, do the fans actually turn)
# happens on real hardware and is written down in docs/research instead. What
# a runner can do is stop the things that have nothing to do with hardware:
# a build that does not compile, a test that regressed, a lint, and a kernel
# patch that would be rejected on style before a maintainer read a line of it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The window needs webkit2gtk; the daemon and the CLI do not. Both are
      # built here because the workspace is built as a whole and a UI that
      # stops compiling should not be found at release time.
      - name: Dependencies for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  kernel-patch:
    name: checkpatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hp-wmi change is meant to be sent upstream, and upstream's first
      # gate is checkpatch. Failing it here is cheaper than failing it on a
      # mailing list.
      - name: Fetch checkpatch
        run: |
          mkdir -p .ci
          curl -sSL -o .ci/checkpatch.pl \
            https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl
          curl -sSL -o .ci/spelling.txt \
            https://raw.githubusercontent.com/torvalds/linux/master/scripts/spelling.txt
          curl -sSL -o .ci/const_structs.checkpatch \
            https://raw.githubusercontent.com/torvalds/linux/master/scripts/const_structs.checkpatch
          chmod +x .ci/checkpatch.pl

      - name: Check the patches
        run: |
          shopt -s nullglob
          patches=(kernel/hp-wmi-8d24/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches to check"
            exit 0
          fi
          # --no-tree because this repository is not a kernel tree; the
          # style checks that matter do not need one.
          perl .ci/checkpatch.pl --no-tree --strict --codespell \
            --ignore FILE_PATH_CHANGES "${patches[@]}"

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is the first thing anyone runs, and it runs as root half
      # way through. A quoting mistake in it is the most expensive kind of
      # bug this project can ship.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh packaging/install.sh packaging/omen-sleep.sh
