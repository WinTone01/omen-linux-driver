# Load omen-kbd-rgb at boot: the keyboard, the graphics mux and the dGPU
# temperature.
#
# The module carries MODULE_ALIAS("wmi:<GUID>"), which would normally be
# enough for udev to autoload it. But it binds as a platform_driver rather
# than a wmi_driver - the WMI device for that GUID is hp-bioscfg's, so it
# calls wmi_evaluate_method instead of attaching to it - and relying on that
# alias would be relying on a side effect. Loading it explicitly is
# deterministic.
#
# On hardware with none of the three the module returns -ENODEV from its
# init and nothing else happens.
omen-kbd-rgb
