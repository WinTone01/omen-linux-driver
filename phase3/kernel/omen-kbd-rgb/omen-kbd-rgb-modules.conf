# Load the RGB keyboard driver at boot.
#
# The module carries MODULE_ALIAS("wmi:<GUID>"), which would normally be
# enough for udev to autoload it. But it binds as a platform_driver rather
# than a wmi_driver - it calls wmi_evaluate_method instead of attaching to
# the WMI device, which is what lets it coexist with in-tree hp-wmi - so
# relying on that alias would be relying on a side effect. Loading it
# explicitly is deterministic.
#
# On hardware without the lighting WMI group the module returns -ENODEV from
# its init and nothing else happens.
omen-kbd-rgb
