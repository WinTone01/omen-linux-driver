PACKAGE_NAME="omen-kbd-rgb"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="omen-kbd-rgb"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"

# Cekirdek clang ile derlenmisse modul de clang ile derlenmeli. Bayragi
# sabitlemek yerine derleme aninda o cekirdege bakiyoruz - ileride gcc ile
# kurulmus bir cekirdek gelirse AUTOINSTALL yine dogru derlesin.
_llvm=$(grep -q '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir}/.config" 2>/dev/null && echo LLVM=1)
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/omen-kbd-rgb/0.1.0/build ${_llvm} modules"
