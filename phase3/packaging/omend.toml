# omend configuration - /etc/omen/omend.toml
#
# If this file is ABSENT the built-in defaults are used; it is not required.
# But if it is PRESENT and broken, the daemon refuses to start: guessing what
# the user "probably meant" is not the right thing to do with a fan curve.

[fan]
# Set to false to have the daemon only observe, writing nothing.
enabled = true

# Sampling interval, in seconds.
interval_secs = 2

# How far the temperature must fall before the setpoint is LOWERED.
# Raising is always immediate - more cooling is the safe direction.
hysteresis_c = 5.0

# Minimum time between two setpoint changes, in seconds.
min_dwell_secs = 20

# Phase 1 §6.3: OGH's own bounds are 1800-4800 RPM.
min_rpm = 1800
max_rpm = 4800

# Setpoints are rounded to this step. The EC's fan target is in hundreds of
# RPM (Phase 1 §3.2), so writing finer than 100 only produces WMI calls that
# land on the same EC value. Raising it reduces writes further.
step_rpm = 100

# The fan curve. rpm = 0 -> hand control to the EC at that temperature.
#
# Leaving the lower region automatic is deliberate: the EC stops the fans
# completely at idle (measured in Phase 2: 0 RPM at 45 C). Taking manual
# control there and forcing 1800 RPM would make the machine louder than it is
# from the factory.
curve = [
  { temp_c = 60.0, rpm = 0    },
  { temp_c = 70.0, rpm = 1800 },
  { temp_c = 80.0, rpm = 2400 },
  { temp_c = 90.0, rpm = 3300 },
  { temp_c = 95.0, rpm = 4800 },
]

[safety]
# Above this temperature the curve is abandoned and control returns to the EC.
# It must be ABOVE the top of the curve (95 C), otherwise the curve's most
# aggressive region can never be used. omend checks this at startup.
critical_c = 97.0

# Leaving an override: normal control resumes 10 C below whichever threshold
# tripped it.
recover_delta_c = 10.0

# Above this temperature, fans reading 0 RPM means cooling has failed and the
# fans are forced to full power.
#
# This is not hypothetical. Measured on this machine: with pwm1_enable = 2 the
# fans stayed at 0 RPM while the CPU climbed 78 -> 85 C in twelve seconds under
# load. The EC does NOT take the curve back the way upstream's
# HP_FAN_SPEED_AUTOMATIC comment implies, at least once the driver has been in
# manual mode. So "hand control to the EC" is not a safe resting state, and
# something has to notice when it is not working.
#
# Keep it well above any legitimate fan-stop (the EC idles the fans in the 40s)
# and below critical_c.
stall_temp_c = 75.0

# How long the fans may read 0 RPM above stall_temp_c before full power is
# forced. A few seconds covers a fan spinning up while the tachometer lags.
stall_grace_secs = 6
